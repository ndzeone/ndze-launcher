name: iOS app

on:
  push:
    paths: ["ios-app/**", ".github/workflows/ios-app.yml"]
  pull_request:
    paths: ["ios-app/**", ".github/workflows/ios-app.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Unit tests (simulator)
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulator: $DEVICE_ID"
          xcodebuild test \
            -project NDZEAI.xcodeproj -scheme NDZEAI \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild-test.log | grep -E "(error|warning: .*concurren|Test Case|TEST (SUCCEEDED|FAILED)|\*\* )" || true
          grep -q "TEST SUCCEEDED" xcodebuild-test.log

      - name: Build unsigned .ipa
        run: |
          set -o pipefail
          xcodebuild build \
            -project NDZEAI.xcodeproj -scheme NDZEAI -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tail -5
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NDZEAI.app Payload/
          zip -qry NDZEAI-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ndze-ai-ios-unsigned
          path: ios-app/NDZEAI-unsigned.ipa
          if-no-files-found: error
